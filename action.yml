name: Arco Cloud deploy
description: Runs an Arco deployment requested by Arco Cloud and reports logs and the result back.
author: multi-api
inputs:
  token:
    description: Short-lived deployment token issued by Arco Cloud.
    required: true
  api-url:
    description: Base URL of the Arco Cloud API.
    required: true
  environment:
    description: Arco environment to deploy.
    required: true
  deployment_id:
    description: Arco Cloud deployment id.
    required: true
  nonce:
    description: One-time nonce used to obtain AWS credentials.
    required: true
  mode:
    description: '"deploy" runs a deployment; "inventory" only reports the resource inventory.'
    required: false
    default: deploy
  working-directory:
    description: Directory containing the Arco project (arco.php; vendor/bin/arco for Laravel apps).
    required: false
    default: '.'
  arco-bin:
    description: >-
      Arco binary to run. Empty (the default) uses the ARCO_BIN environment variable, else vendor/bin/arco.
      A path with a slash is relative to working-directory; a bare name such as "arco" is looked up on PATH
      (for apps without vendor/ that install Arco with `composer global require multiapi/arco`).
    required: false
    default: ''
runs:
  using: node24
  main: dist/index.js
