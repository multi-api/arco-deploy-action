name: Publish client

on:
  push:
    tags:
      - 'client-v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match the package version
        run: |
          version="$(node -p "require('./packages/client/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "client-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/client version ${version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm test -w packages/client
      - run: npm run build -w packages/client
      - run: npm publish -w packages/client --access public --provenance
